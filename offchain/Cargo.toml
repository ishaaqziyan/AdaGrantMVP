[package]
name = "milestone_escrow_api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
dotenvy = "0.15"

pallas-txbuilder = "1"
pallas-primitives = "1"
pallas-codec = "1"
pallas-addresses = "1"
pallas-crypto = "1"

blockfrost = "1"
blockfrost-openapi = "0"
reqwest = { version = "0.13", features = ["json"] }
tower-http = { version = "0.6", features = ["cors"] }
